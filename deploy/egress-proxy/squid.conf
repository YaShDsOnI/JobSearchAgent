# JobFinderAgent egress proxy (Squid 6.12). The only route from the internal `backend`
# network to the internet. Design: docs/source-connectors.md, "Deployment enforcement".
#
# Allowed: CONNECT to port 443 of an allowlisted host that resolves to public addresses only,
# from the backend network only. Everything else is denied. TLS is end to end: the proxy
# sees only host:443, never paths, queries, headers, or bodies.

http_port 3128

# Rendered at start-up by the entrypoint from EGRESS_ALLOWLIST and EGRESS_CLIENT_CIDR.
acl clients src "/run/squid/clients.txt"
# -n: never reverse-resolve an IP-literal CONNECT, so an IP can never match a hostname rule.
acl allowed_hosts dstdom_regex -n -i "/run/squid/allowlist.regex"

acl SSL_port port 443
acl CONNECT method CONNECT

# Non-public destinations: loopback, private, link-local and cloud metadata, CGNAT,
# reserved, documentation, benchmarking, multicast, broadcast, and IPv6 equivalents
# (including IPv4-mapped, NAT64, Teredo, and 6to4 encodings).
acl non_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16
acl non_public dst 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16
acl non_public dst 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl non_public dst ::/128 ::1/128 ::ffff:0:0/96 64:ff9b::/96 64:ff9b:1::/48 100::/64
acl non_public dst 2001::/32 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 ff00::/8

http_access deny !clients
http_access deny !CONNECT
http_access deny !SSL_port
http_access deny !allowed_hosts
# Checked last, so DNS is only resolved for allowlisted hosts. A host with ANY non-public
# answer is refused, matching the application's own rule.
http_access deny non_public
http_access allow clients
http_access deny all

# No caching, no identifying or forwarding headers, no version disclosure.
cache deny all
cache_mem 0 MB
via off
forwarded_for delete
httpd_suppress_version_string on

# Log only time, client, result, method, and host:port. CONNECT carries nothing else.
logformat jfa %ts.%03tu %>a %Ss/%03>Hs %rm %ru
access_log stdio:/dev/stdout jfa
cache_log stdio:/dev/stderr
cache_store_log none
pid_filename none
coredump_dir /tmp
shutdown_lifetime 3 seconds
